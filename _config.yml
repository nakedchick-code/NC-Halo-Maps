# NC Halo Maps
# Site for NakedChick's Halo: PC/CE custom maps.
# Release data in _data/releases.json is generated automatically by
# .github/workflows/fetch-releases.yml - do not edit that file by hand.

title: NC Halo Maps
tagline: "Custom maps for Halo: PC/CE"
description: Custom multiplayer maps for Halo Custom Edition, built by NakedChick.

# Update these if a custom domain (CNAME file) is added later.
url: "https://nakedchick-code.github.io"
baseurl: "/NC-Halo-Maps"

lang: en-GB
locale: en_GB
timezone: Etc/UTC
site_scale: 0.65

# jekyll-seo-tag options
title_separator: "|"
twitter:
  card: summary_large_image

author:
  name: NakedChick
  url: https://github.com/nakedchick-code

image: /assets/images/social-preview.png
favicon: favicon.ico

repository: nakedchick-code/NC-Halo-Maps

links:
  github: https://github.com/nakedchick-code/NC-Halo-Maps
  releases: https://github.com/nakedchick-code/NC-Halo-Maps/releases
  new_release: https://github.com/nakedchick-code/NC-Halo-Maps/releases/new
  issues: https://github.com/nakedchick-code/NC-Halo-Maps/issues
  profile: https://github.com/nakedchick-code

sass:
  style: compressed

incremental: true
plugins_cache: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: true

# Don't ship build/dev files to the generated site.
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - run.bat
  - vendor
  - node_modules

defaults:
  - scope:
      path: ""
    values:
      layout: "default"