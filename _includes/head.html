<!--
  NC Halo Maps
  Site for NakedChick's Halo: PC/CE custom maps.
  Site Developer: https://github.com/Chalwk/
-->

<meta charset="UTF-8">
<meta content="width=device-width, initial-scale={{ site.site_scale | default: 1 }}, viewport-fit=cover" name="viewport">
<meta name="theme-color" content="#14100c">
<meta name="color-scheme" content="dark">
<meta name="author" content="{{ site.author.name | default: site.title }}">

<!--
  jekyll-seo-tag emits: <title>, <meta name="description">, canonical,
  og:title/description/url/type/image/image:alt/site_name, twitter:card/
  title/description/image, and JSON-LD.
-->
{% seo %}

<!-- favicon + touch icon -->
{% if site.favicon %}
<link href="{{ site.favicon | relative_url }}" rel="icon" type="image/x-icon">
{% endif %}
{% if site.image %}
<link href="{{ site.image | relative_url }}" rel="apple-touch-icon">
{% endif %}

<!-- preconnect hints for external resources -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://cdnjs.cloudflare.com" rel="preconnect">

<!-- stylesheets -->
<link href="{{ site.baseurl }}/assets/css/core.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link
  href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
  rel="stylesheet">

<!-- structured data so search engines understand the site -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "description": {{ site.description | jsonify }},
  "inLanguage": {{ site.lang | default: 'en' | jsonify }}
}
</script>
