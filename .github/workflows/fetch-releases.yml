name: Fetch Releases Data

#
# Technical notes for those who care:
#

# This workflow runs on a schedule and whenever a release changes,
# using the automatic GITHUB_TOKEN (1,000 requests/hour quota).
# It writes the results to _data/releases.json, which Jekyll then reads
# at build time. Because the data is baked into the static site, visitors'
# browsers never call the GitHub API directly, so there's no risk of the
# unauthenticated public rate limit (60 requests/hour) ever being hit.
#
# Each release is classified by game using the detectGames() helper below:
#   1. Exact tag match:   "PC"  "CE"
#   2. Bracket in title:  "[CE] My Map", "[PC] My Map"
#   3. Fallback:          DEFAULT_GAME
#
# Every release gets a `games` array (containing exactly one entry, since a
# map can only be for one game), so the Maps page can always render a
# PC / CE badge for it.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  release:
    types: [published, edited, unpublished, deleted, prereleased, released]
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: fetch-releases
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch releases via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Which game to fall back to if a release can't be identified.
            // 'CE' = Custom Edition, 'PC' = Combat Evolved.
            const DEFAULT_GAME = 'CE';

            function humanSize(bytes) {
              if (!bytes && bytes !== 0) return 'Unknown size';
              const units = ['B', 'KB', 'MB', 'GB'];
              let size = bytes;
              let unit = 0;
              while (size >= 1024 && unit < units.length - 1) {
                size /= 1024;
                unit++;
              }
              return `${size.toFixed(size >= 10 || unit === 0 ? 0 : 1)} ${units[unit]}`;
            }

            function extractThumbnail(body) {
              if (!body) return null;
              // First markdown image in the release body, e.g. ![alt](url)
              const match = body.match(/!\[[^\]]*\]\((https?:\/\/[^\s)]+)\)/);
              return match ? match[1] : null;
            }

            function detectGames(release) {
              const tag = (release.tag_name || '').trim().toUpperCase();

              // Primary path: releases are tagged exactly "PC" or "CE".
              if (tag === 'PC') return ['PC'];
              if (tag === 'CE') return ['CE'];

              // Fallback for older/odd releases that don't use a plain tag.
              // Look for a [PC] or [CE] bracket anywhere in the release title.
              const title = release.name || '';
              const bracketMatches = title.match(/\[[^\]]+\]/g) || [];
              for (const raw of bracketMatches) {
                const token = raw.toUpperCase();
                if (/\bPC\b/.test(token) || /COMBAT EVOLVED/.test(token)) return ['PC'];
                if (/\bCE\b/.test(token) || /CUSTOM EDITION/.test(token)) return ['CE'];
              }

              // Fallback: default game if no tag or bracket marker was found.
              return [DEFAULT_GAME || 'CE'];
            }

            const IMAGE_RE = /\.(png|jpe?g|gif|webp)$/i;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const data = releases
              .filter(r => !r.draft)
              .map(r => {
                const imageAssets = r.assets.filter(a => IMAGE_RE.test(a.name));
                const mapAssets = r.assets.filter(a => !IMAGE_RE.test(a.name));

                return {
                  id: r.id,
                  tag: r.tag_name,
                  name: r.name || r.tag_name,
                  body: r.body || '',
                  prerelease: !!r.prerelease,
                  published_at: r.published_at || r.created_at,
                  html_url: r.html_url,
                  games: detectGames(r),
                  thumbnail: (imageAssets[0] && imageAssets[0].browser_download_url) || extractThumbnail(r.body),
                  assets: mapAssets.map(a => ({
                    name: a.name,
                    size: a.size,
                    size_human: humanSize(a.size),
                    download_count: a.download_count,
                    browser_download_url: a.browser_download_url,
                    content_type: a.content_type
                  }))
                };
              })
              // newest first
              .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

            const serialized = JSON.stringify(data, null, 2) + '\n';

            // Sanity-check: the JSON we're about to write must round-trip.
            try {
              JSON.parse(serialized);
            } catch (err) {
              core.setFailed(`Generated releases.json is not valid JSON: ${err.message}`);
              return;
            }

            const dataDir = path.join(process.env.GITHUB_WORKSPACE, '_data');
            fs.mkdirSync(dataDir, { recursive: true });
            fs.writeFileSync(path.join(dataDir, 'releases.json'), serialized);

            core.info(`Wrote ${data.length} release(s) to _data/releases.json`);

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/releases.json
          if git diff --staged --quiet; then
            echo "No changes to releases.json"
          else
            git commit -m "chore: update releases data"
            git push
          fi